seed: 7

conditioning:
  source_file: ../Datos/processed_image2/processed_image2/shell_2600.npz
  batch_size: 8

architect:
  checkpoint: models/architect/latest/best.pt

engineer:
  checkpoint: models/engineer/latest/best.pt

sampling:
  num_inference_steps: 50
  # ddim / exponential: integrador exponencial, exacto para la trayectoria coseno
  #   si (z_hat, eps_hat) fueran constantes en el paso. Una evaluación por paso.
  # euler | midpoint | heun | rk4: integradores ODE genéricos de dx/dt = u.
  #   midpoint y heun cuestan 2 evaluaciones por paso; rk4 cuesta 4.
  # ddpm: posterior ancestral VP, estocástico.
  solver: ddim
  eta: 0.0  # Sólo para solver: ddim. solver: ddpm usa internamente eta=1.0.
  clip_denoised: false  # true: recorta la geometría limpia normalizada a [-1, 1].
  time_spacing: quadratic
  guidance_scale: 1.0
  grad_clip: 5.0
  guidance_schedule: bell
  guide_w_min: 0.0
  guide_w_max: 1.0
  guide_power: 1.5
  bell_peak: 0.5
  bell_width: 0.22

mlflow:
  tracking_uri: ./mlruns
  experiment_name: vp_ddim_guided_sampling_solid
  run_name_prefix: sample
  tags:
    pipeline: vp_ddim_pbunet
    stage: thesis

runtime:
  device: auto
